name: Frontend CI-CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Dev/Application-Code/frontend/**'
      - 'Dev/Kubernetes-Manifests-file/Frontend/**'
  pull_request:
    branches: [ main, master ]

env:
  AWS_REGION: us-east-1
  AWS_ECR_REPO_NAME: frontend-repo   # Replace with your actual ECR repository name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      # 1. Checkout Code from Repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      # 2. Setup Node.js Environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Trivy Filesystem Security Scan
      - name: Run Trivy vulnerability scanner in filesystem mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-dir: 'Dev/Application-Code/frontend'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      # 4. Configure AWS Credentials (Hardcoded Keys Version)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Build, Tag, and Push Docker Image to ECR
      - name: Build, tag, and push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.AWS_ECR_REPO_NAME }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          cd Application-Code/frontend
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      # 7. Trivy Container Image Security Scan
      - name: Run Trivy vulnerability scanner on built Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_ECR_REPO_NAME }}:${{ github.run_number }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      # 8. Update Kubernetes Manifest & Push Back (GitOps Sync Loop)
      - name: Update Kubernetes Deployment Manifest & Push
        env:
          IMAGE_TAG: ${{ github.run_number }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          git config --global user.name "udindas777"
          git config --global user.email "udindas@example.com"
          
          cd Kubernetes-Manifests-file/Frontend
          
          # Automatically replaces the image tag in deployment.yaml
          sed -i "s|image:.*|image: ${REGISTRY}/${AWS_ECR_REPO_NAME}:${IMAGE_TAG}|g" deployment.yaml
          
          git add deployment.yaml
          git commit -m "ci(gitops): update frontend image tag to version ${IMAGE_TAG}"
          git push origin HEAD:main
